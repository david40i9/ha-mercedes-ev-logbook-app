name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly, to catch Home Assistant changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check .
      - name: App syntax
        run: node --check custom_components/mb_logbook_app/www/app.js
      - name: Tests
        run: pytest -q
